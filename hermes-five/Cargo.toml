[package]
name = "hermes-five"
description.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true

[badges.maintenance]
status = "actively-developed"

[lib]

[features]
default = ["libudev"]
libudev = ["serialport/libudev"]
serde = ["dep:serde", "dep:serde_json", "dep:typetag"]
mocks = []

[dependencies]
hermes-five-macros = { path = "../hermes-five-macros", version = "0.1.0" }
dyn-clone = "1.0.19"
futures = "0.3.31"
log = "0.4.26"
num-traits = "0.2.19"
parking_lot = "0.12.3"
simple-easing = "1.0.1"
snafu = "0.8.5"
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "parking_lot"] }
# Protocol(s)
serialport = { version = "4.7.0", default-features = false }
# Feature dependent
serde = { version = "1.0.219", optional = true }
serde_json = { version = "1.0.140", optional = true }
typetag = { version = "0.2.20", optional = true }

[dev-dependencies]
serial_test = "3.2.0"
version-sync = "0.9.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

