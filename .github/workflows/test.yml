name: Test

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      matrix:
        os: [ ubuntu-latest ]

    steps:

      - name: Build | install dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt install libudev-dev

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Run all feature tests
        run: cargo test --workspace --all-features --verbose --color=always
        env:
          RUST_BACKTRACE: 1

      - name: Run default features tests
        run: cargo test --workspace --verbose --color=always
        env:
          RUST_BACKTRACE: 1

      - name: Test compiling external project using Hermes-Five library
        run: |
          cd hermes-five/tests/compile_tests
          cargo check